<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البطاقات والموظفين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>نظام إدارة البطاقات</h1>
        
        <div class="section">
            <h2>إنشاء بطاقة جديدة</h2>
            <form id="createCardForm">
                <input type="text" id="cardNumber" placeholder="رقم البطاقة" required>
                <input type="text" id="holderName" placeholder="اسم حامل البطاقة" required>
                <input type="number" id="balance" placeholder="الرصيد" required>
                <input type="date" id="expiryDate" required> 
                <button type="submit">إنشاء البطاقة</button>
            </form>
        </div>

        <div class="section">
            <h2>سحب من البطاقة</h2>
            <form id="withdrawForm">
                <input type="text" id="withdrawCardNumber" placeholder="رقم البطاقة" required>
                <input type="number" id="amount" placeholder="المبلغ" required>
                <button type="submit">تنفيذ السحب</button>
            </form>
        </div>

        <div class="section">
            <h2>الموظفين</h2>
            <form id="createEmployeeForm">
                <input type="text" id="employeeId" placeholder="رقم الموظف" required>
                <input type="text" id="employeeName" placeholder="اسم الموظف" required>
                <input type="text" id="permissions" placeholder="الصلاحيات (مفصولة بفواصل)" >
                <button type="submit">إضافة موظف</button>
            </form>
        </div>

        <div id="responseMessage" class="message"></div>
        
        <div class="cards-list" id="cardsList"></div>
        <div class="employees-list" id="employeesList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
